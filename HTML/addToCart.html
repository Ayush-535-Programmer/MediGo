<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart</title>
  <link rel="stylesheet" href="../CSS/userHomeStyle.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-center">
      <a href="userHome.html" class="home-btn">
        <i class="fas fa-home"></i> HOME
      </a>      
    </div>
  </nav>

  <main class="cart-page">
    <h2>Shopping Cart</h2>
    
    <!-- Cart Items Section -->
    <div id="cart-items">
      <!-- Example of one cart item -->
      <div class="cart-item">
        <img src="medicine.jpg" alt="Medicine Name">
        <div class="cart-details">
          <h3>Medicine Name</h3>
          <p>Price: ₹<span class="medicine-price">100</span></p>
          <p>Quantity: <span class="quantity">1</span></p>
          <p>Total: ₹<span class="total-price">100</span></p>
          <div class="quantity-controls">
            <button class="decrease-btn">-</button>
            <button class="increase-btn">+</button>
          </div>
        </div>
      </div>
      <!-- More cart items can be added dynamically -->
    </div>
    
    <h3>Total Price: ₹<span id="total-price">0</span></h3>
    <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
  </main>

  <script src="../JavaScript/cartScript.js"></script>
</body>
</html>
