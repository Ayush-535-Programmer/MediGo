<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup/Login</title>
    <link rel="stylesheet" href="../CSS/userLogin.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="toggle">
                <button id="toggleLogin">Login</button>
                <button id="toggleSignup" class="active">Signup</button>
            </div>
            <div class="form-box">
                <!-- Signup Form -->
                <form id="signupForm">
                    <h2>Signup</h2>
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                    <input type="tel" id="signup-phone" placeholder="Phone" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <input type="text" id="signup-address" placeholder="Address" required>
                    <select id="signup-gender" required>
                        <option value="" disabled selected>Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <label for="signup-dob">Date of Birth</label>
                    <input type="date" id="signup-dob" required>
                    <button type="submit" id="signup-btn">Sign Up</button>
                </form>

                <!-- Login Form -->
                <form id="loginForm" class="hidden">
                    <h2>Login</h2>
                    <input type="tel" id="login-phone" placeholder="Phone" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" id="login-btn">Login</button>
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </form>
            </div>
        </div>
    </div>
    <script src="../JavaScript/userLogin.js"></script>
</body>
</html>
