<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <link rel="stylesheet" href="../CSS/adminlogin.css">
</head> 
<body>
  <div class="login-container">
    <div class="login-form-side">
      <div class="container">
        <h2>Admin Login</h2>
        <form id="loginForm" action="admin-dashboard.html" method="POST">
          <div class="form-box">
            <label for="admin-email">Email</label>
            <input type="email" id="admin-email" name="email" required placeholder="Enter your email" />
          </div>
          <div class="form-box">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" name="password" required placeholder="Enter your password" />
          </div>
          <button type="submit">Login</button>
        </form>
        <p><a href="#">Forgot your password?</a></p>
      </div>
    </div>
  </div>
  <script src="../JavaScript/adminLogin.js"></script>
</body>
</html>
