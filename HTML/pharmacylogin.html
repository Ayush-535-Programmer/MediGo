<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pharmacy Login / Signup</title>
  <link rel="stylesheet" href="../CSS/pharmacyLogin.css" />
</head>
<body>
  <div class="container">

    <!-- Right Form Section -->
    <div class="form-section">
      <div class="glass-container">
        <div class="toggle-buttons">
          <button id="toggleLogin">Login</button>
          <button id="toggleSignup" class="active">Signup</button>
        </div>

        <div class="form-wrapper">
          <!-- Signup Form -->
          <form id="signupForm">
            <h2>Pharmacy Signup</h2>

            <label for="pharmacy-name">Pharmacy Name</label>
            <input type="text" id="pharmacy-name" placeholder="Pharmacy Name" required />

            <label for="pharmacy-phone">Phone</label>
            <input type="tel" id="pharmacy-phone" placeholder="Phone" required />

            <label for="pharmacy-email">Email</label>
            <input type="email" id="pharmacy-email" placeholder="Email" required />

            <label for="pharmacy-password">Password</label>
            <input type="password" id="pharmacy-password" placeholder="Password" required />

            <label for="pharmacy-address">Address</label>
            <input type="text" id="pharmacy-address" placeholder="Address" required />

            <button type="submit">Sign Up</button>
          </form>

          <!-- Login Form -->
          <form id="loginForm" class="hidden">
            <h2>Pharmacy Login</h2>

            <label for="login-phone">Phone</label>
            <input type="tel" id="login-phone" placeholder="Phone" required />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Password" required />

            <button type="submit">Login</button>
            <a href="#">Forgot Password?</a>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="../JavaScript/pharmacyLogin.js"></script>
</body>
</html>
